<!DOCTYPE html>
<html lang="en">
<head>

   <style>
    body{
    margin: 0;
    display: flex;
    justify-content: center;   /* Horizontal center */
    align-items: center;       /* Vertical center */
    height: 100vh;             /* Full screen height */
    background-color: #f5f5f5;
}
    .container{
      
        width: 400px;
        height: 500px;
        border: 2px solid black;
    }
    .textarea{
        display: flex;
        width: 100%;
        height: 20%;
        justify-content: center;
        margin-top: 10px;
    }
     .textarea1{
        width: 90%;
        height: 70%;
    }

    .button{
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        
    }
    button{
        width: 100px;
        height: 50px;
        margin: 10px;
       
    }
   </style>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="textarea"><input type="text" class="textarea1"></div>
        <div class="button">
            <button onclick="document.querySelector('.textarea1').value= display+='1' ;">1</button>
            <button onclick="document.querySelector('.textarea1').value= display+='2' ;"> 2</button>
            <button onclick="document.querySelector('.textarea1').value= display+='3' ;">3</button>
            <button onclick="document.querySelector('.textarea1').value= display+='4' ;">4</button>
            <button onclick="document.querySelector('.textarea1').value= display+='5' ;">5</button>
            <button onclick="document.querySelector('.textarea1').value= display+='6' ;">6</button>
            <button onclick="document.querySelector('.textarea1').value= display+='7' ;">7</button>
            <button onclick="document.querySelector('.textarea1').value= display+='8' ;">8</button>
            <button onclick="document.querySelector('.textarea1').value= display+='9' ;">9</button>
            <button onclick="document.querySelector('.textarea1').value= display+='+' ;">+</button>
            <button onclick="document.querySelector('.textarea1').value= display+='-' ;">-</button>
            <button onclick="document.querySelector('.textarea1').value= display+='*' ;">*</button>
            <button onclick="document.querySelector('.textarea1').value= display+='/' ;">/</button>
            <button onclick="document.querySelector('.textarea1').value= display='' ;">C</button>
            <button onclick=" let result=eval(display); display=result;
            document.querySelector('.textarea1').value= display";>=</button>

        </div>
    </div>

    <script>
        let display=0;
        document.querySelector('.textarea1').value=`${display}`;
    </script>
</body>
</html>
